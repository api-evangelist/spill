name: Spill
description: >-
  Spill is a UK-based employee assistance programme (EAP) that delivers mental
  health support to employees directly inside the tools teams already use, such
  as Slack and Microsoft Teams. The platform offers same-day, message-based
  counselling, structured multi-session therapy courses for specific mental
  health conditions, drop-in group sessions, manager mental-health training, and
  self-guided wellbeing content, all through a single subscription. Spill serves
  over 600 companies on month-to-month terms and is backed by Seedcamp. It is a
  B2B software-as-a-service wellbeing product rather than an API provider; no
  public developer API, OpenAPI specification, or SDK has been published.
